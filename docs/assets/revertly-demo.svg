<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <defs>
    <linearGradient id="g-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB54C"/><stop offset="1" stop-color="#FF5C6A"/></linearGradient>
  </defs>
  <style>
    .fg{fill:#F4ECDF} .dim{fill:#A99C88} .grn{fill:#33D69F} .red{fill:#FF5C6A}
    .yel{fill:#FFCF4D} .amb{fill:#FF9F1C} .b{font-weight:700}
    .scene{opacity:0}
    .sA{animation:sA 8s linear infinite} .sB{animation:sB 8s linear infinite} .sC{animation:sC 8s linear infinite}
    @keyframes sA{0%,33%{opacity:1}36%,100%{opacity:0}}
    @keyframes sB{0%,37%{opacity:0}40%,64%{opacity:1}67%,100%{opacity:0}}
    @keyframes sC{0%,68%{opacity:0}71%,97%{opacity:1}99.9%,100%{opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.scene,.sA,.sB,.sC,.cur{animation:none!important}.sA{opacity:1!important}}
  </style>

  <!-- window chrome -->
  <rect x="2" y="2" width="856" height="356" rx="14" fill="#17130E" stroke="#34291D" stroke-width="1.5"/>
  <circle cx="28" cy="26" r="6.5" fill="#ff5f57"/><circle cx="50" cy="26" r="6.5" fill="#febc2e"/><circle cx="72" cy="26" r="6.5" fill="#28c840"/>
  <!-- brand mark + wordmark -->
  <g transform="translate(372,15) scale(0.10)">
    <rect x="20" y="20" width="200" height="200" rx="54" fill="url(#g-mark)"/>
    <g fill="none" stroke="#17130E" stroke-width="22" stroke-linecap="round"><path d="M77 104 A46 46 0 1 0 112 75"/></g>
    <polygon points="88,80 116,91 108,58" fill="#17130E"/>
  </g>
  <text x="398" y="31" class="fg b" font-size="14">revert<tspan class="amb">ly</tspan></text>
  <line x1="2" y1="50" x2="858" y2="50" stroke="#34291D"/>

  <!-- Scene A: the agent goes rogue -->
  <g class="scene sA">
    <text x="26" y="86" class="dim" text-anchor="start">1 · your agent runs full speed — and goes off the rails</text>
    <text x="26" y="128"><tspan class="grn b">$</tspan><tspan class="fg" x="46"> claude "refactor the parser"</tspan></text>
    <text x="26" y="166"><tspan class="amb">●</tspan><tspan class="fg" x="46">Edit  src/parser.py</tspan></text>
    <text x="26" y="196"><tspan class="amb">●</tspan><tspan class="fg" x="46">Write src/utils.py</tspan></text>
    <text x="26" y="226"><tspan class="amb">●</tspan><tspan class="fg" x="46">Bash  rm README.md</tspan><tspan class="red" x="330">  ⟵ hallucinated "cleanup"</tspan></text>
    <text x="26" y="272" class="grn">revertly: recorded 3 changes · nothing is permanent</text>
  </g>

  <!-- Scene B: see exactly what happened -->
  <g class="scene sB">
    <text x="26" y="86" class="dim">2 · see exactly what it did — pre-image vs now</text>
    <text x="26" y="128"><tspan class="grn b">$</tspan><tspan class="fg" x="46"> revertly diff</tspan></text>
    <text x="26" y="164" class="amb">@@ src/parser.py @@</text>
    <text x="26" y="192" class="red">-    return x.split(",")</text>
    <text x="26" y="218" class="grn">+    return x.split(";")   # BUG the agent added</text>
    <text x="26" y="252" class="red">-  README.md   (deleted)</text>
    <text x="26" y="290" class="yel b">2 to restore, 1 to delete, 0 conflicts</text>
  </g>

  <!-- Scene C: undo all of it -->
  <g class="scene sC">
    <text x="26" y="86" class="dim">3 · undo any of it — one command, itself reversible</text>
    <text x="26" y="128"><tspan class="grn b">$</tspan><tspan class="fg" x="46"> revertly revert --yes</tspan></text>
    <text x="26" y="166" class="grn"><tspan xml:space="preserve">  restore  src/parser.py</tspan></text>
    <text x="26" y="194" class="grn"><tspan xml:space="preserve">  restore  README.md</tspan></text>
    <text x="26" y="222" class="red"><tspan xml:space="preserve">  delete   src/utils.py</tspan></text>
    <text x="26" y="262" class="grn b">reverted — your project is back. nothing was lost.</text>
    <text x="26" y="298"><tspan class="grn b">$</tspan><tspan class="fg cur" x="46"> ▍</tspan></text>
  </g>
</svg>
