<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="revertly logo">
  <defs>
    <linearGradient id="rl-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB54C"/>
      <stop offset="1" stop-color="#FF5C6A"/>
    </linearGradient>
  </defs>
  <!-- safety "chip" -->
  <rect x="20" y="20" width="200" height="200" rx="54" fill="url(#rl-g)"/>
  <!-- revert / undo arrow, cut in warm ink -->
  <g fill="none" stroke="#17130E" stroke-width="22" stroke-linecap="round">
    <path d="M77 104 A46 46 0 1 0 112 75"/>
  </g>
  <!-- arrowhead tangent to the arc end (top-left), pointing left = undo -->
  <polygon points="88,80 116,91 108,58" fill="#17130E"/>
</svg>
