name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: verify (macOS, py${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    env:
      REVERTLY_NO_NOTIFY: "1"   # no desktop popups on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: py_compile + full test suite + e2e (verify.sh)
        run: ./verify.sh
